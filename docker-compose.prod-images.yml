# Docker Compose configuration for production using PRE-BUILT images
# Usage: After loading images with `docker load -i naturetranquille-images.tar.gz`
#        Run: docker compose -f docker-compose.prod-images.yml --env-file .env.prod up -d

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: naturetranquille-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naturetranquille}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\" -d \"${POSTGRES_DB:-naturetranquille}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: naturetranquille-backend:latest
    container_name: naturetranquille-backend-prod
    working_dir: /app
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-naturetranquille}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  frontend:
    image: naturetranquille-frontend:latest
    container_name: naturetranquille-frontend-prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-naturetranquille}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
      NEXT_PUBLIC_MAPLIBRE_STYLE: ${NEXT_PUBLIC_MAPLIBRE_STYLE:-https://demotiles.maplibre.org/style.json}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}
    depends_on:
      - db
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

volumes:
  postgres_data:
